name: test-and-publish

on:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    if: github.repository == 'rtfpessoa/diff2html' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get next release version
        run: bash .github/scripts/release-version.sh
      - name: Upload versions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: versions
          if-no-files-found: error
          path: |
            next-version.txt
            publish-tag.txt

  build:
    if: github.repository == 'rtfpessoa/diff2html' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    needs: [version]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies and validate
        run: bash .github/scripts/validate.sh

  publish:
    if: github.repository == 'rtfpessoa/diff2html' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    needs: [build, version]
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies and validate
        run: bash .github/scripts/validate.sh
      - name: Download versions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: versions
      - name: Stamp package version
        id: release
        run: |
          version=$(<next-version.txt)
          tag=$(<publish-tag.txt)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $tag == latest ]]
          # The clean tree was already validated. Skip local release hooks and Git tagging here.
          npm --ignore-scripts version --no-git-tag-version "$version"
          { printf 'version=%s\n' "$version"; printf 'tag=%s\n' "$tag"; } >> "$GITHUB_OUTPUT"
      - name: Publish to npm with trusted publishing
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Use the OIDC-capable CLI only here; validation keeps its own pinned npm version.
          npm_cli=(npm)
          if [[ $(npm --version) != 12.2.3 ]]; then
            npm_cli=(npm exec --yes --package=npm@12.2.3 -- npm)
          fi
          [[ $("${npm_cli[@]}" --version) == 12.2.3 ]]
          "${npm_cli[@]}" publish --registry https://registry.npmjs.org/ --access public --tag "$RELEASE_TAG"
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          config=$(mktemp "$RUNNER_TEMP/diff2html-gpr.XXXXXX")
          trap 'rm -f "$config"' EXIT
          printf '%s\n' "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" > "$config"
          npm pkg set 'name=@rtfpessoa/diff2html'
          npm publish --userconfig "$config" --registry https://npm.pkg.github.com/ --access public --tag "$RELEASE_TAG"
      - name: Tag published commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --field "ref=refs/tags/$RELEASE_VERSION" --field "sha=$GITHUB_SHA"
      - name: Upload docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          if-no-files-found: error
          path: docs/
